name: CI

on:
  push:
    branches:
      - main
    paths:
      - aws_fleet_scout/**
      - tests/**
      - pyproject.toml
      - setup.cfg
      - MANIFEST.in
      - pixi.toml
      - Makefile
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - aws_fleet_scout/**
      - tests/**
      - pyproject.toml
      - setup.cfg
      - MANIFEST.in
      - pixi.toml
      - Makefile
      - .github/workflows/ci.yml
  workflow_dispatch:

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install environment
        run: pixi install

      - name: Run quality checks
        run: make check

      - name: Build package
        run: make build

      - name: Verify package metadata
        run: pixi run python -m twine check dist/*
