name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  verify-version:
    name: Verify release tag matches package version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag and package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          content = Path("aws_fleet_scout/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', content)
          if not match:
              raise SystemExit("Could not find __version__")
          print(match.group(1))
          PY
          )

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="${RELEASE_TAG#v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "Release tag ($RELEASE_TAG) does not match package version ($VERSION)."
              exit 1
            fi
            echo "Release tag matches package version: $VERSION"
          else
            echo "Non-release trigger ($EVENT_NAME). Version check skipped."
          fi

  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    name: Publish distribution
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - build
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
