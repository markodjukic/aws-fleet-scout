name: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - aws_fleet_scout/**
      - pyproject.toml
      - setup.cfg
      - MANIFEST.in
      - .release-please-config.json
      - .release-please-manifest.json
      - .github/workflows/release-please.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_PLEASE_BRANCH: release-please--branches--main--components--aws-fleet-scout

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_ACTIONS }}

      - uses: googleapis/release-please-action@v4.4.0
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GH_TOKEN_ACTIONS }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4

      - name: Refresh pixi.lock on release branch
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin "$RELEASE_PLEASE_BRANCH" >/dev/null 2>&1; then
            echo "No release-please branch present; nothing to update."
            exit 0
          fi

          git fetch origin "$RELEASE_PLEASE_BRANCH"
          git checkout -B "$RELEASE_PLEASE_BRANCH" "origin/$RELEASE_PLEASE_BRANCH"

          pixi lock

          if git diff --quiet -- pixi.lock; then
            echo "pixi.lock already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixi.lock
          git commit -m "chore: refresh pixi lockfile"
          git push origin HEAD:"$RELEASE_PLEASE_BRANCH"
